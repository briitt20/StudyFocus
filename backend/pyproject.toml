[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dlkrix-0", email = "60622021@continental.edu.pe" }
]
requires-python = ">=3.13"
dependencies = [
    "bcrypt==4.0.1",
    "fastapi>=0.165.0",
    "passlib[bcrypt]>=1.9.5",
    "pydantic-settings>=2.16.3",
    "pydantic[email]>=2.14.4",
    "pyodbc>=5.5.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
